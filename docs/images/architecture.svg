<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">代码、网站与旅行数据分别保存在哪里</title><desc id="desc">GitHub 保存可公开的项目代码；Vercel 构建并运行 Next.js 页面和 API；旅行记录与照片分别存于站主自己的 Supabase 数据库和私有 Storage。浏览器访问网站，不直接持有服务器密钥。公开首页仍会展示站主已保存的记录和关联照片。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 8 4.5 0 9" fill="none" stroke="#789888" stroke-width="1.7"/></marker></defs>
<rect width="1200" height="680" rx="24" fill="#f5f7f2"/>
<g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="52" y="64" font-size="16" letter-spacing="3" fill="#698476">TRAVEL MAP / HOW IT WORKS</text><text x="52" y="111" font-size="33" font-weight="700" fill="#243f3b">代码可以公开，数据由你自己管理</text>
<g fill="#fffefa" stroke="#d8e3d6"><rect x="52" y="170" width="270" height="145" rx="18"/><rect x="455" y="170" width="325" height="145" rx="18"/><rect x="912" y="170" width="236" height="145" rx="18"/><rect x="230" y="436" width="325" height="134" rx="18"/><rect x="670" y="436" width="325" height="134" rx="18"/></g>
<g font-size="25" font-weight="700" fill="#243f3b"><text x="79" y="215">GitHub 仓库</text><text x="482" y="215">Vercel / Next.js</text><text x="939" y="215">浏览器</text><text x="257" y="480">Supabase Postgres</text><text x="697" y="480">Supabase Storage</text></g>
<g font-size="17" fill="#667d6e"><text x="79" y="255">代码、锁文件、迁移与说明</text><text x="79" y="285">可复制模板，版本可追踪</text><text x="482" y="255">页面 + API，部署时注入配置</text><text x="482" y="285">服务器密钥留在服务端</text><text x="939" y="255">首页浏览旅行</text><text x="939" y="285">/edit 验证后编辑</text><text x="257" y="519">旅行、称呼、故事和会话</text><text x="257" y="548">保存在你自己的项目中</text><text x="697" y="519">travel-photos 私有照片桶</text><text x="697" y="548">已关联照片经网站 API 提供</text></g>
<g fill="none" stroke="#789888" stroke-width="2" marker-end="url(#arrow)"><path d="M331 245H443"/><path d="M791 245H900"/><path d="M574 324V365H393V425"/><path d="M661 324V365H832V425"/></g>
<g font-size="15" fill="#698476" text-anchor="middle"><text x="388" y="230">推送后自动部署</text><text x="846" y="230">页面与接口</text><text x="490" y="393">服务端读写</text><text x="751" y="393">服务端上传 / 读取</text></g>
<rect x="52" y="608" width="1096" height="42" rx="11" fill="#e5eee1"/><text x="74" y="635" font-size="17" fill="#2e7163">编辑口令限制修改；公开首页仍会展示全部已保存的旅行和关联照片。源码备份不等于数据库与照片备份。</text></g></svg>
