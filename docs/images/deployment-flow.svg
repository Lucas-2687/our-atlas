<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
<title id="title">旅行地图：从复制模板到记录旅行的六个步骤</title><desc id="desc">依次创建自己的 GitHub 仓库，创建 Supabase 项目，执行五个迁移，导入 Vercel 并填写三个环境变量，打开 edit 完成首次设图，然后通过网页记录旅行。本图是操作流程示意，不是平台控制台截图。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 8 4.5 0 9" fill="none" stroke="#789888" stroke-width="1.7"/></marker></defs>
<rect width="1200" height="710" rx="24" fill="#f5f7f2"/>
<g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="52" y="64" font-size="16" letter-spacing="3" fill="#698476">TRAVEL MAP / START HERE</text><text x="52" y="113" font-size="34" font-weight="700" fill="#243f3b">六步，拥有自己的旅行地图</text><text x="52" y="148" font-size="18" fill="#6c7e73">先准备仓库和数据库，再部署网站；每一步都能单独检查是否完成。</text>
<g fill="#fffefa" stroke="#d8e3d6"><rect x="52" y="186" width="336" height="180" rx="18"/><rect x="432" y="186" width="336" height="180" rx="18"/><rect x="812" y="186" width="336" height="180" rx="18"/><rect x="52" y="430" width="336" height="180" rx="18"/><rect x="432" y="430" width="336" height="180" rx="18"/><rect x="812" y="430" width="336" height="180" rx="18"/></g>
<g fill="#2e7163"><circle cx="88" cy="225" r="17"/><circle cx="468" cy="225" r="17"/><circle cx="848" cy="225" r="17"/><circle cx="88" cy="469" r="17"/><circle cx="468" cy="469" r="17"/><circle cx="848" cy="469" r="17"/></g>
<g fill="white" font-size="17" text-anchor="middle"><text x="88" y="231">1</text><text x="468" y="231">2</text><text x="848" y="231">3</text><text x="88" y="475">4</text><text x="468" y="475">5</text><text x="848" y="475">6</text></g>
<g font-size="23" fill="#243f3b" font-weight="700"><text x="118" y="233">复制 GitHub 模板</text><text x="498" y="233">创建 Supabase</text><text x="878" y="233">初始化数据库</text><text x="118" y="477">部署到 Vercel</text><text x="498" y="477">网站首次设置</text><text x="878" y="477">开始记录旅行</text></g>
<g font-size="17" fill="#647b6d"><text x="76" y="281">Use this template → 创建新仓库</text><text x="76" y="312">结果：代码在你自己的账号下</text><text x="456" y="281">New project → 保存项目配置</text><text x="456" y="312">结果：拥有自己的数据库与存储</text><text x="836" y="281">SQL Editor → 按顺序执行 0001–0005</text><text x="836" y="312">结果：应用表、函数、私有照片桶</text><text x="76" y="525">导入自己的仓库，填写三个变量</text><text x="76" y="556">结果：得到可访问的网站地址</text><text x="456" y="525">打开 /edit，设置称呼和编辑口令</text><text x="456" y="556">结果：唯一的共同地图已建立</text><text x="836" y="525">新增地点、日期、照片和故事</text><text x="836" y="556">结果：首页展示已保存的回忆</text></g>
<g stroke="#789888" stroke-width="2" marker-end="url(#arrow)"><path d="M396 276h26"/><path d="M776 276h26"/><path d="M396 520h26"/><path d="M776 520h26"/></g>
<path d="M220 393H980" stroke="#d0ddd0" stroke-dasharray="5 6"/><rect x="428" y="377" width="344" height="30" rx="15" fill="#e5eee1"/><text x="600" y="398" text-anchor="middle" font-size="16" fill="#47735c">完成 1–3 后，继续进行 4–6</text>
<text x="52" y="660" font-size="15" fill="#697f6e">操作流程示意，非真实控制台截图。已有线上网站请使用升级流程，勿重复初始化生产数据。</text></g></svg>
